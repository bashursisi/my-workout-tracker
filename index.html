<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<style>
:root{--bg:#eef0ec;--card:#fff;--ink:#1d2b2a;--mute:#6b7b79;--line:#d5dad6;--acc:#0f6b64;--hi:#f2c230;--soft:#e4efed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a19;--card:#1b2625;--ink:#e9efed;--mute:#91a3a0;--line:#2c3a38;--acc:#4fc3b8;--soft:#22302e}}
:root[data-theme="dark"]{--bg:#121a19;--card:#1b2625;--ink:#e9efed;--mute:#91a3a0;--line:#2c3a38;--acc:#4fc3b8;--soft:#22302e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:4px 0 10px}
h2{font-size:17px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:8px;white-space:nowrap}
.tabs button.on,.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.next{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.note{font-size:13px;color:var(--mute)}
.last{font-size:13px;color:var(--mute);margin:4px 0 8px}
.tip{display:inline-block;background:var(--hi);color:#2b2200;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.row{display:grid;grid-template-columns:26px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.row span{color:var(--mute);font-size:14px;text-align:center}
input{width:100%;font:inherit;font-size:17px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=date]{width:auto;padding:8px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.hist{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.hist .s{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}
.hist small{color:var(--mute)}
.del{font-size:13px;padding:4px 8px;color:#b3261e}
.foot{color:var(--mute);font-size:12px;margin-top:16px}
</style><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f6b64">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
</head><body><main>
<h1>Workout tracker</h1>
<div class="tabs" id="tabs"></div>
<div class="next" id="next"></div>
<div id="view"></div>
<p class="foot">Saved in this browser on this device only. Rule: 3 sets of 8-12 reps. When all 3 sets reach 12, add 2.5 kg.</p>
</main>
<script>
var PLAN=[
{n:"Chest & Biceps",ex:[["Machine chest press"],["Seated incline DB press"],["Cable fly"],["Incline dumbbell curl","Elbows behind torso"],["Cable curl"],["Incline walk","20 min","cardio"]]},
{n:"Back & Triceps",ex:[["Chin-up","3 x 6-10, chin level with bar, no swinging"],["Pull-up","3 x 4-8, chin over bar, no swinging"],["Chest-supported row"],["Lat pulldown (front)"],["Seated cable row"],["Reverse-grip cable pushdown","Neck-safe, replaces overhead"],["Rope pushdown"],["Machine triceps extension","Seated, back supported"]]},
{n:"Legs (quad focus)",ex:[["Leg press (light)","Back flat on the pad"],["Leg extension"],["Seated leg curl"],["Calf raise"],["Incline walk","20 min","cardio"]]},
{n:"Upper Body",ex:[["Machine chest press"],["Chest-supported row"],["Lat pulldown (front)"],["Machine shoulder press","Back supported, light"],["Hammer curl","Targets brachialis"],["Incline walk","20 min","cardio"]]},
{n:"Shoulders & Core",ex:[["Machine shoulder press","Back supported, light"],["Lateral raise"],["Rear-delt machine"],["Cable crunch","3 x 10-12, hands on chest, not head"],["Pallof press","3 x 10 each side, anti-rotation"],["Dead bug","3 x 10"],["Side plank","3 x 20 s each side"],["Plank","3 x 30 s"]]},
{n:"Lower Body",ex:[["Seated leg curl"],["Adductor machine"],["Abductor machine"],["Hip thrust (light)","Pause 1 s at top, no arching the lower back"],["Cable glute kickback","3 x 10-12 each side, stand tall, don't swing"],["Glute bridge","3 x 12, light, slow"],["Calf raise"]]}
];
var KEY="wtrack_app_v1",LOG=[],cur=0,view="log";
try{LOG=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){LOG=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(LOG))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pretty(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function lastSets(name){for(var i=LOG.length-1;i>=0;i--){var e=LOG[i].ex[name];if(e)return{date:LOG[i].date,sets:e}}return null}
function hint(sets){return sets&&sets.length===3&&sets.every(function(s){return +s[1]>=12})}
function fmt(sets){return sets.map(function(s){return s[0]+"kg x "+s[1]}).join(", ")}
function nextDay(){if(!LOG.length)return 0;var last=LOG[LOG.length-1].day;return (last+1)%PLAN.length}
function go(i){cur=i;view="log";render()}
function render(){
 var t=document.getElementById("tabs");t.innerHTML="";
 PLAN.forEach(function(d,i){var b=document.createElement("button");b.textContent=(i+1)+". "+d.n.split(" ")[0];if(i===cur)b.className="on";b.onclick=function(){go(i)};t.appendChild(b)});
 var nd=nextDay();
 document.getElementById("next").innerHTML="Next in rotation: <b>Day "+(nd+1)+" "+esc(PLAN[nd].n)+"</b>"+(LOG.length?"":" (start here)");
 var v=document.getElementById("view");
 if(view==="hist"){renderHist(v);return}
 var d=PLAN[cur];
 var html='<div class="bar"><label class="note">Date <input type="date" id="dt" value="'+today()+'"></label><button class="btn" onclick="showHist()">History</button></div>';
 html+='<div class="card"><h2>Day '+(cur+1)+': '+esc(d.n)+'</h2></div>';
 d.ex.forEach(function(e,i){
  var name=e[0],lastS=lastSets(name),tip=lastS&&hint(lastS.sets)?'<div class="tip">All sets hit 12: add 2.5 kg</div>':"";
  var sub=e[1]?'<div class="note">'+esc(e[1])+'</div>':"";
  if(e[2]==="cardio"){html+='<div class="card"><div class="top"><h2>'+esc(name)+'</h2><span class="note">'+esc(e[1])+'</span></div><div class="note">Write speed and incline in the notes box below.</div><input id="n'+i+'" placeholder="Speed / incline" style="margin-top:8px"></div>';return}
  var rows="";
  for(var k=0;k<3;k++){var p=lastS&&lastS.sets[k]?lastS.sets[k]:["",""];
   rows+='<div class="row"><span>'+(k+1)+'</span><input inputmode="decimal" placeholder="kg" id="w'+i+'_'+k+'" value="'+esc(p[0])+'"><input inputmode="numeric" placeholder="reps" id="r'+i+'_'+k+'" value="'+esc(p[1])+'"></div>'}
  html+='<div class="card"><div class="top"><h2>'+esc(name)+'</h2></div>'+sub+'<div class="last">'+(lastS?"Last ("+pretty(lastS.date)+"): "+fmt(lastS.sets):"No entries yet")+'</div>'+tip+rows+'</div>';
 });
 html+='<button class="btn primary" style="width:100%" onclick="saveSession()">Save session</button>';
 v.innerHTML=html;
}
function saveSession(){
 var d=PLAN[cur],date=document.getElementById("dt").value||today(),ex={},any=false;
 d.ex.forEach(function(e,i){
  if(e[2]==="cardio"){var n=document.getElementById("n"+i).value.trim();if(n){ex[e[0]]=[[n,""]];any=true}return}
  var s=[];for(var k=0;k<3;k++){var w=document.getElementById("w"+i+"_"+k).value.trim(),r=document.getElementById("r"+i+"_"+k).value.trim();if(w!==""&&r!=="")s.push([w,r])}
  if(s.length){ex[e[0]]=s;any=true}
 });
 if(!any){alert("Enter at least one set first.");return}
 LOG.push({date:date,day:cur,ex:ex});save();
 cur=nextDay();render();
}
function showHist(){view="hist";render()}
function renderHist(v){
 var h='<div class="bar"><button class="btn" onclick="view=\'log\';render()">Back to log</button></div>';
 if(!LOG.length){v.innerHTML=h+'<div class="card">No sessions saved yet.</div>';return}
 h+='<div class="card hist">';
 LOG.map(function(s,idx){return[s,idx]}).reverse().forEach(function(p){
  var s=p[0],idx=p[1],lines="";
  Object.keys(s.ex).forEach(function(n){lines+="<div><b>"+esc(n)+":</b> "+(s.ex[n][0][1]===""?esc(s.ex[n][0][0]):esc(fmt(s.ex[n])))+"</div>"});
  h+='<div class="s"><div><b>'+esc(pretty(s.date))+'</b> <small>Day '+(s.day+1)+' '+esc(PLAN[s.day].n)+'</small>'+lines+'</div><button class="btn del" onclick="delSession('+idx+')">Delete</button></div>';
 });
 h+='</div>';
 v.innerHTML=h;
}
function delSession(i){if(confirm("Delete this session?")){LOG.splice(i,1);save();render()}}
render();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body></html>
